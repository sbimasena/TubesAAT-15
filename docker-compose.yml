services:
  bmkg:
    build: ./services/bmkg
    ports:
      - "${BMKG_PORT:-8081}:8081"
    environment:
      BMKG_API_KEY: ${BMKG_API_KEY:-dev-bmkg-key}
      BMKG_GENERATE_INTERVAL_SECONDS: ${BMKG_GENERATE_INTERVAL_SECONDS:-15}
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 3

  pvmbg:
    build: ./services/pvmbg
    ports:
      - "${PVMBG_PORT:-8082}:8082"
    environment:
      PVMBG_TOKEN: ${PVMBG_TOKEN:-dev-pvmbg-token}
      PVMBG_DELAY_MS: ${PVMBG_DELAY_MS:-750}
      PVMBG_GENERATE_INTERVAL_SECONDS: ${PVMBG_GENERATE_INTERVAL_SECONDS:-15}
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 3

  aggregator:
    build: ./services/aggregator
    environment:
      AGGREGATOR_PORT: 8083
      BMKG_BASE_URL: ${BMKG_BASE_URL:-http://bmkg:8081}
      PVMBG_BASE_URL: ${PVMBG_BASE_URL:-http://pvmbg:8082}
      BMKG_API_KEY: ${BMKG_API_KEY:-dev-bmkg-key}
      PVMBG_TOKEN: ${PVMBG_TOKEN:-dev-pvmbg-token}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-3}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env; see .env.example}
      BROKER_URL: ${BROKER_URL:?Set BROKER_URL in .env; see .env.example}
    depends_on:
      bmkg:
        condition: service_healthy
      pvmbg:
        condition: service_healthy
      canonical-store:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    networks:
      - default
      - storage
      - events
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  canonical-store:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hazards}
      POSTGRES_USER: ${POSTGRES_USER:-aggregator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - canonical-data:/var/lib/postgresql/data
    networks:
      - storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  message-broker:
    image: rabbitmq:4.2-management-alpine
    hostname: message-broker
    command: ["/bin/sh", "/etc/rabbitmq/start-with-topology.sh"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-hazard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - broker-data:/var/lib/rabbitmq
      - ./infrastructure/message-broker/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infrastructure/message-broker/start-with-topology.sh:/etc/rabbitmq/start-with-topology.sh:ro
    networks:
      - events
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/topology-ready && rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  client-api:
    build: ./services/client-api
    ports:
      - "${CLIENT_API_PORT:-8080}:8080"
    environment:
      CLIENT_API_PORT: 8080
      AGGREGATOR_BASE_URL: ${AGGREGATOR_BASE_URL:-http://aggregator:8083}
      AGGREGATOR_REQUEST_TIMEOUT_MS: ${AGGREGATOR_REQUEST_TIMEOUT_MS:-5000}
      CLIENT_API_MAX_CONCURRENT_REQUESTS: ${CLIENT_API_MAX_CONCURRENT_REQUESTS:-64}
      ENABLE_PROVISIONAL_HAZARD_ENDPOINT: ${ENABLE_PROVISIONAL_HAZARD_ENDPOINT:-false}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://auth:8084}
      AUTH_REQUEST_TIMEOUT_MS: ${AUTH_REQUEST_TIMEOUT_MS:-5000}
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?Set AUTH_INTERNAL_SECRET in .env}
    depends_on:
      aggregator:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 5s

  auth:
    build: ./services/auth
    environment:
      AUTH_PORT: 8084
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?Set JWT_SIGNING_SECRET in .env}
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?Set AUTH_INTERNAL_SECRET in .env}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-60}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-3600}
      MEDIA_CLIENT_ID: ${MEDIA_CLIENT_ID:-media}
      MEDIA_CLIENT_PASSWORD: ${MEDIA_CLIENT_PASSWORD:?Set MEDIA_CLIENT_PASSWORD in .env}
      FIELD_TEAM_CLIENT_ID: ${FIELD_TEAM_CLIENT_ID:-field-team}
      FIELD_TEAM_CLIENT_PASSWORD: ${FIELD_TEAM_CLIENT_PASSWORD:?Set FIELD_TEAM_CLIENT_PASSWORD in .env}
      INTERNAL_OPS_CLIENT_ID: ${INTERNAL_OPS_CLIENT_ID:-internal-ops}
      INTERNAL_OPS_CLIENT_PASSWORD: ${INTERNAL_OPS_CLIENT_PASSWORD:?Set INTERNAL_OPS_CLIENT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${AUTH_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 5s

  notification-consumer:
    build: ./services/notification-consumer
    environment:
      BROKER_URL: ${BROKER_URL:?Set BROKER_URL in .env}
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - events
    volumes:
      - notification-data:/data
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  dashboard-consumer:
    build: ./services/dashboard-consumer
    environment:
      BROKER_URL: ${BROKER_URL:?Set BROKER_URL in .env}
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - events
    volumes:
      - dashboard-data:/data
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  storage:
    internal: true
  events: {}

volumes:
  canonical-data:
  broker-data:
  notification-data:
  dashboard-data:
