<text x="799" y="494" class="heading" text-anchor="start"><tspan x="799" dy="0">MapVolcanic</tspan></text>
<text x="799" y="532" class="body" text-anchor="start"><tspan x="799" dy="0">Referensi volcano_id</tspan><tspan x="799" dy="30">Field tambahan → attributes</tspan><tspan x="799" dy="30">confidence_level opsional</tspan><tspan x="799" dy="30">HazardEvent vulkanik</tspan></text>
