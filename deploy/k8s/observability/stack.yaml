apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
# Prometheus discovers app pods through the API (prometheus.yml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-prometheus
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-prometheus
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: observability-prometheus}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: observability}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      nodeSelector: {node-role.kubernetes.io/control-plane: "true"}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          # Short retention keeps it inside the "Komponen lain" memory class (Lampiran B).
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
                 "--storage.tsdb.retention.time=6h"]
          ports: [{name: http, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
---
# Jaeger all-in-one, in memory: OTLP/HTTP on 4318 (OTEL_EXPORTER_OTLP_ENDPOINT), UI on 16686.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      nodeSelector: {node-role.kubernetes.io/control-plane: "true"}
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60.0
          args: ["--memory.max-traces=5000"]
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
          ports:
            - {name: ui, containerPort: 16686}
            - {name: otlp-http, containerPort: 4318}
          readinessProbe: {httpGet: {path: /, port: 14269}}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector: {app: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: ui}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
# Grafana with Prometheus and Jaeger provisioned and the "BNPB Overview" dashboard from
# dashboards/overview.json. Reachable only by port-forward, so anonymous Editor (needed
# for Explore) is acceptable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, uid: prometheus, type: prometheus, url: "http://prometheus:9090", isDefault: true}
      - {name: Jaeger, uid: jaeger, type: jaeger, url: "http://jaeger:16686"}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - {name: bnpb, type: file, options: {path: /var/lib/grafana/dashboards}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      nodeSelector: {node-role.kubernetes.io/control-plane: "true"}
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Editor}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/overview.json}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: http}}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: provisioning, configMap: {name: grafana-provisioning}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: {app: grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
