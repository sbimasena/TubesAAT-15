<text x="59" y="779" class="heading" text-anchor="start"><tspan x="59" dy="0">Client-Facing API</tspan></text>
<text x="59" y="817" class="body" text-anchor="start"><tspan x="59" dy="0">Query HazardEvent</tspan><tspan x="59" dy="30">melalui API internal</tspan></text>
<rect x="405" y="195" width="280" height="175" fill="#f5f7f8" stroke="#345d78" stroke-width="2"/>
<text x="424" y="234" class="heading" text-anchor="start"><tspan x="424" dy="0">Poller BMKG</tspan></text>
<text x="424" y="272" class="body" text-anchor="start"><tspan x="424" dy="0">Timeout HTTP: 2 detik</tspan><tspan x="424" dy="30">Fetch event lalu warning</tspan><tspan x="424" dy="30">Dua cursor terpisah</tspan></text>
<rect x="780" y="195" width="350" height="175" fill="white" stroke="#24313b" stroke-width="2"/>
<text x="799" y="234" class="heading" text-anchor="start"><tspan x="799" dy="0">Korelasi + MapSeismic</tspan></text>
<text x="799" y="272" class="body" text-anchor="start"><tspan x="799" dy="0">Cache event / warning</tspan><tspan x="799" dy="30">Korelasi melalui event_id</tspan><tspan x="799" dy="30">HazardEvent seismik</tspan></text>
