# Auth and Client API (role=api, Lampiran B "Auth dan Client-Facing API").
# Auth keeps sessions in memory: one replica until D-AUTH (owner B) is decided.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: auth}
  template:
    metadata:
      labels: {app: auth, role: api}
    spec:
      containers:
        - name: auth
          image: bnpb/auth
          ports: [{name: http, containerPort: 8084}]
          envFrom: [{configMapRef: {name: bnpb-config}}]
          env:
            - name: AUTH_PORT
              value: "8084"
            - name: JWT_SIGNING_SECRET
              valueFrom: {secretKeyRef: {name: auth-credentials, key: JWT_SIGNING_SECRET}}
            - name: AUTH_INTERNAL_SECRET
              valueFrom: {secretKeyRef: {name: auth-credentials, key: AUTH_INTERNAL_SECRET}}
            - name: MEDIA_CLIENT_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-credentials, key: MEDIA_CLIENT_PASSWORD}}
            - name: FIELD_TEAM_CLIENT_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-credentials, key: FIELD_TEAM_CLIENT_PASSWORD}}
            - name: INTERNAL_OPS_CLIENT_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-credentials, key: INTERNAL_OPS_CLIENT_PASSWORD}}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: {seconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector: {app: auth}
  ports: [{name: http, port: 8084, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-api
spec:
  replicas: 1
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: client-api}
  template:
    metadata:
      labels: {app: client-api, role: api}
    spec:
      containers:
        - name: client-api
          image: bnpb/client-api
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: bnpb-config}}]
          env:
            - name: CLIENT_API_PORT
              value: "8080"
            - name: AUTH_INTERNAL_SECRET
              valueFrom: {secretKeyRef: {name: auth-credentials, key: AUTH_INTERNAL_SECRET}}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: {seconds: 5}
---
# Public entry point: every node answers on 30080 (k3d maps host 8080 to it).
apiVersion: v1
kind: Service
metadata:
  name: client-api
spec:
  type: NodePort
  selector: {app: client-api}
  ports: [{name: http, port: 8080, targetPort: http, nodePort: 30080}]
