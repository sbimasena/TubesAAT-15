# Local k3d cluster (scripts/k8s/dev-cluster.sh). Images are built locally and loaded
# with `k3d image import`; scripts/k8s/deploy.sh replaces the tag with the git SHA.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

images:
  - {name: bnpb/aggregator, newTag: dev}
  - {name: bnpb/auth, newTag: dev}
  - {name: bnpb/bmkg, newTag: dev}
  - {name: bnpb/client-api, newTag: dev}
  - {name: bnpb/dashboard-consumer, newTag: dev}
  - {name: bnpb/notification-consumer, newTag: dev}
  - {name: bnpb/pvmbg, newTag: dev}
