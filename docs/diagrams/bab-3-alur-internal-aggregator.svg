<text x="1230" y="980" class="edge" text-anchor="middle"><tspan x="1230" dy="0">SQL</tspan><tspan x="1230" dy="29">Baca outbox</tspan></text>
<polyline points="1130,1095 1330,1095" fill="none" stroke="#24313b" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<rect x="1198.6" y="1110" width="62.8" height="29" fill="white"/>
<text x="1230" y="1133" class="edge" text-anchor="middle"><tspan x="1230" dy="0">AMQP</tspan></text>
<text x="406" y="958" class="small" text-anchor="start"><tspan x="406" dy="0">Poller BMKG dan PVMBG</tspan><tspan x="406" dy="31">berjalan mandiri.</tspan></text>
<text x="406" y="1050" class="small" text-anchor="start"><tspan x="406" dy="0">Query membaca data tersimpan;</tspan><tspan x="406" dy="31">tidak menunggu fetch upstream.</tspan></text>
<text x="40" y="1210" class="small" text-anchor="start"><tspan x="40" dy="0">Cursor maju setelah commit. Request jaringan dilakukan di luar lock pengelolaan state.</tspan></text>
<text x="40" y="1243" class="small" text-anchor="start"><tspan x="40" dy="0">Panah HTTP/SQL menunjukkan pemanggil → tujuan; panah internal menunjukkan alur data atau operasi repository.</tspan></text>
<text x="40" y="1276" class="small" text-anchor="start"><tspan x="40" dy="0">Worker outbox berjalan terpisah dari polling. Garis putus-putus menunjukkan publikasi event.</tspan></text>
