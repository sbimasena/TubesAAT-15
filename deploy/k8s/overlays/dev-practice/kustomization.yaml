apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: ""
      version: v1
      kind: ConfigMap
      name: bnpb-config
    patch: |-
      - op: replace
        path: /data/PANTAI_BASE_URL
        value: ""
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: sensor-pantai
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
