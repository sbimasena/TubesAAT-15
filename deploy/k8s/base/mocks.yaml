# BMKG and PVMBG mocks (role=mock, Lampiran B "Mock"). The Tester Agent reaches the
# PVMBG admin endpoint from the node network (hostNetwork), so NetworkPolicy must allow node IPs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmkg
spec:
  replicas: 1
  selector:
    matchLabels: {app: bmkg}
  template:
    metadata:
      labels: {app: bmkg, role: mock}
    spec:
      containers:
        - name: bmkg
          image: bnpb/bmkg
          ports: [{name: http, containerPort: 8081}]
          envFrom: [{configMapRef: {name: bnpb-config}}]
          env:
            - name: BMKG_API_KEY
              valueFrom: {secretKeyRef: {name: source-credentials, key: BMKG_API_KEY}}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bmkg
spec:
  selector: {app: bmkg}
  ports: [{name: http, port: 8081, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvmbg
spec:
  replicas: 1
  selector:
    matchLabels: {app: pvmbg}
  template:
    metadata:
      labels: {app: pvmbg, role: mock}
    spec:
      containers:
        - name: pvmbg
          image: bnpb/pvmbg
          ports: [{name: http, containerPort: 8082}]
          envFrom: [{configMapRef: {name: bnpb-config}}]
          env:
            - name: PVMBG_TOKEN
              valueFrom: {secretKeyRef: {name: source-credentials, key: PVMBG_TOKEN}}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pvmbg
spec:
  selector: {app: pvmbg}
  ports: [{name: http, port: 8082, targetPort: http}]
