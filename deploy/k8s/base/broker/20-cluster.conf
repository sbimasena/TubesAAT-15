# 3-member cluster (D-BROKER). A blank member joins the first reachable peer listed here.
# Names follow RABBITMQ_NODENAME in broker.yaml; the namespace is fixed by kustomization.yaml.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-0.rabbitmq-headless.sistem-informasi-kebencanaan-bnpb.svc.cluster.local
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-1.rabbitmq-headless.sistem-informasi-kebencanaan-bnpb.svc.cluster.local
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-2.rabbitmq-headless.sistem-informasi-kebencanaan-bnpb.svc.cluster.local
cluster_partition_handling = pause_minority

# Queues declared before all members joined start with fewer replicas; grow them to 3
# whenever a member comes (back) up.
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3
quorum_queue.continuous_membership_reconciliation.trigger_interval = 10000

# The Raft WAL lives in memory up to this size (default 512MB); keep it inside the 1Gi limit.
raft.wal_max_size_bytes = 64000000
