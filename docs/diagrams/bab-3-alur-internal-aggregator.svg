<text x="1475" y="950" class="small" text-anchor="middle"><tspan x="1475" dy="0">Hazard + outbox</tspan><tspan x="1475" dy="31">dalam satu transaksi</tspan></text>
<polyline points="1130,1040 1235,1040 1235,890 1330,890" fill="none" stroke="#24313b" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
