# Non-secret configuration (same variables as .env.example, k8s service names).
# Credentials live in Secrets created by scripts/k8s/deploy.sh:
#   source-credentials: BMKG_API_KEY, PVMBG_TOKEN
#   store-credentials:  POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD (Aggregator + store only)
#   broker-credentials: RABBITMQ_DEFAULT_USER, RABBITMQ_DEFAULT_PASS
#   auth-credentials:   AUTH_INTERNAL_SECRET, JWT_SIGNING_SECRET, *_CLIENT_PASSWORD
#   pantai-token:       token (PANTAI_AUTH_TOKEN; name fixed by the Sensor Pantai manifest)
apiVersion: v1
kind: ConfigMap
metadata:
  name: bnpb-config
data:
  BMKG_GENERATE_INTERVAL_SECONDS: "10"
  PVMBG_DELAY_MS: "750"
  PVMBG_GENERATE_INTERVAL_SECONDS: "10"
  BMKG_BASE_URL: http://bmkg:8081
  PVMBG_BASE_URL: http://pvmbg:8082
  POLL_INTERVAL_SECONDS: "3"
  AGGREGATOR_BASE_URL: http://aggregator:8083
  AGGREGATOR_REQUEST_TIMEOUT_MS: "5000"
  CLIENT_API_MAX_CONCURRENT_REQUESTS: "64"
  ENABLE_PROVISIONAL_HAZARD_ENDPOINT: "false"
  AUTH_BASE_URL: http://auth:8084
  AUTH_REQUEST_TIMEOUT_MS: "5000"
  ACCESS_TOKEN_TTL_SECONDS: "60"
  REFRESH_TOKEN_TTL_SECONDS: "3600"
  MEDIA_CLIENT_ID: media
  FIELD_TEAM_CLIENT_ID: field-team
  INTERNAL_OPS_CLIENT_ID: internal-ops
