<text x="799" y="1039" class="heading" text-anchor="start"><tspan x="799" dy="0">Worker outbox</tspan></text>
<text x="799" y="1077" class="body" text-anchor="start"><tspan x="799" dy="0">Ambil pesan pending</tspan><tspan x="799" dy="30">Publish + publisher confirm</tspan></text>
