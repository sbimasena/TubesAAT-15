<text x="1349" y="779" class="heading" text-anchor="start"><tspan x="1349" dy="0">Canonical Store</tspan></text>
<text x="1349" y="817" class="body" text-anchor="start"><tspan x="1349" dy="0">PostgreSQL</tspan><tspan x="1349" dy="30">hazard_events + JSONB</tspan><tspan x="1349" dy="30">hazard_outbox</tspan></text>
<rect x="1330" y="1000" width="290" height="130" fill="white" stroke="#24313b" stroke-width="2"/>
<text x="1349" y="1039" class="heading" text-anchor="start"><tspan x="1349" dy="0">RabbitMQ</tspan></text>
<text x="1349" y="1077" class="body" text-anchor="start"><tspan x="1349" dy="0">Exchange hazard.events</tspan><tspan x="1349" dy="30">Fanout ke dua queue</tspan></text>
