# RabbitMQ dan consumer akan dihubungkan pada tahap berikutnya.
services:
  bmkg:
    build: ./services/bmkg
    ports:
      - "${BMKG_PORT:-8081}:8081"
    environment:
      BMKG_API_KEY: ${BMKG_API_KEY:-dev-bmkg-key}
      BMKG_GENERATE_INTERVAL_SECONDS: ${BMKG_GENERATE_INTERVAL_SECONDS:-15}

  pvmbg:
    build: ./services/pvmbg
    ports:
      - "${PVMBG_PORT:-8082}:8082"
    environment:
      PVMBG_TOKEN: ${PVMBG_TOKEN:-dev-pvmbg-token}
      PVMBG_DELAY_MS: ${PVMBG_DELAY_MS:-750}
      PVMBG_GENERATE_INTERVAL_SECONDS: ${PVMBG_GENERATE_INTERVAL_SECONDS:-15}

  aggregator:
    build: ./services/aggregator
    ports:
      - "${AGGREGATOR_PORT:-8083}:8083"
    environment:
      AGGREGATOR_PORT: 8083
      BMKG_BASE_URL: ${BMKG_BASE_URL:-http://bmkg:8081}
      PVMBG_BASE_URL: ${PVMBG_BASE_URL:-http://pvmbg:8082}
      BMKG_API_KEY: ${BMKG_API_KEY:-dev-bmkg-key}
      PVMBG_TOKEN: ${PVMBG_TOKEN:-dev-pvmbg-token}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-3}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env; see .env.example}
    depends_on:
      bmkg:
        condition: service_started
      pvmbg:
        condition: service_started
      canonical-store:
        condition: service_healthy
    networks:
      - default
      - storage
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  canonical-store:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hazards}
      POSTGRES_USER: ${POSTGRES_USER:-aggregator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - canonical-data:/var/lib/postgresql/data
    networks:
      - storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  client-api:
    build: ./services/client-api
    ports:
      - "${CLIENT_API_PORT:-8080}:8080"

  auth:
    build: ./services/auth
    environment:
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-60}

  notification-consumer:
    build: ./services/notification-consumer

  dashboard-consumer:
    build: ./services/dashboard-consumer

networks:
  storage:
    internal: true

volumes:
  canonical-data:
