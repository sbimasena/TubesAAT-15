<text x="40" y="1520" class="small" text-anchor="start"><tspan x="40" dy="0">Panah HTTP/SQL: pemanggil → tujuan. Garis putus-putus: event AMQP; HazardEvent membawa traceparent ke kedua consumer.</tspan></text>
<text x="40" y="1552" class="small" text-anchor="start"><tspan x="40" dy="0">Field report: Client API publish ke queue field-reports dan menunggu confirm sebelum menjawab 202; diproses replika Aggregator.</tspan></text>
<text x="40" y="1584" class="small" text-anchor="start"><tspan x="40" dy="0">Semua komponen kecuali Feed Satelit berjalan di cluster k3s 3 node; Tester Agent (DaemonSet asisten) ada di setiap node.</tspan></text>
